version: '3.8'

services:
  proxy:
    image: ${NGINX_IMAGE:?Defina NGINX_IMAGE por digest (Nginx >= 1.27.3 alpine)}
    user: '101:101'
    entrypoint: ['nginx']
    command: ['-g', 'daemon off;']
    read_only: true
    cap_drop: [ALL]
    tmpfs:
      - /tmp:size=128m,mode=1777
    configs:
      - source: nginx
        target: /etc/nginx/nginx.conf
    secrets:
      - source: tls_cert
        target: tls_cert
        uid: '101'
        gid: '101'
        mode: 0400
      - source: tls_key
        target: tls_key
        uid: '101'
        gid: '101'
        mode: 0400
    ports:
      - target: 8443
        published: 443
        protocol: tcp
        mode: host
    networks: [edge]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/proxy-health']
      interval: 15s
      timeout: 3s
      retries: 3
    deploy:
      mode: global
      placement:
        constraints: ['node.labels.naporta.edge == true']
      update_config:
        order: stop-first
        failure_action: rollback
      resources:
        limits: {cpus: '1', memory: 256M}
        reservations: {cpus: '0.10', memory: 64M}
    logging: &logging
      driver: json-file
      options: {max-size: '10m', max-file: '3'}

  backend:
    image: ${BACKEND_IMAGE:?Defina BACKEND_IMAGE por digest}
    user: '1000:1000'
    entrypoint: ['/bin/sh', '/opt/naporta/backend-entrypoint.sh']
    command: ['node', 'dist/main.js']
    read_only: true
    cap_drop: [ALL]
    tmpfs:
      - /tmp:size=256m,mode=1777
    configs:
      - source: backend_entrypoint
        target: /opt/naporta/backend-entrypoint.sh
    secrets:
      - source: database_url
        target: database_url
        uid: '1000'
        gid: '1000'
        mode: 0400
      - source: jwt_secret
        target: jwt_secret
        uid: '1000'
        gid: '1000'
        mode: 0400
    environment:
      NODE_ENV: production
      API_PORT: '3000'
      TRUST_PROXY: 'true'
      JWT_ISSUER: ${JWT_ISSUER:?Defina JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Defina JWT_AUDIENCE}
      JWT_TTL_SECONDS: '900'
      CORS_ORIGINS: ${CORS_ORIGINS:?Defina CORS_ORIGINS}
      CACHE_DRIVER: file
      CACHE_DIRECTORY: /tmp/naporta-cache
      CACHE_TTL_SECONDS: '30'
      CACHE_MAX_BYTES: '67108864'
    networks: [edge, data]
    stop_grace_period: 30s
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      replicas: ${API_REPLICAS:-2}
      endpoint_mode: dnsrr
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 45s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits: {cpus: '1', memory: 512M}
        reservations: {cpus: '0.25', memory: 128M}
    logging: *logging

  db:
    image: ${POSTGRES_IMAGE:?Defina POSTGRES_IMAGE por digest (PostgreSQL 18 alpine)}
    environment:
      POSTGRES_DB: naporta
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256 --auth-local=peer'
    command: ['postgres', '-c', 'password_encryption=scram-sha-256', '-c', 'max_connections=100', '-c', 'hba_file=/etc/postgresql/pg_hba.conf', '-c', 'log_statement=none', '-c', 'log_min_error_statement=panic']
    configs:
      - source: db_hba
        target: /etc/postgresql/pg_hba.conf
      - source: db_init
        target: /docker-entrypoint-initdb.d/10-access.sql
        mode: 0444
      - source: db_roles
        target: /opt/naporta/roles.sql
      - source: db_grants
        target: /opt/naporta/grants.sql
    secrets:
      - postgres_password
      - app_password
      - migrator_password
      - reader_password
    volumes:
      - postgres_data:/var/lib/postgresql
    networks: [data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d naporta']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints: ['node.labels.naporta.database == true']
      update_config: {order: stop-first}
      resources:
        limits: {cpus: '2', memory: 1G}
        reservations: {cpus: '0.25', memory: 256M}
    logging: *logging

networks:
  edge:
    driver: overlay
    driver_opts: {encrypted: ''}
  data:
    driver: overlay
    internal: true
    driver_opts: {encrypted: ''}
    ipam:
      config:
        - subnet: ${DB_SUBNET:-10.42.0.0/24}

volumes:
  postgres_data:

configs:
  nginx:
    name: ${STACK_NAME:-naporta}_nginx_${CONFIG_VERSION:-v1}
    file: ../nginx/nginx.conf
  backend_entrypoint:
    name: ${STACK_NAME:-naporta}_backend_entrypoint_${CONFIG_VERSION:-v1}
    file: ./backend-entrypoint.sh
  db_hba:
    name: ${STACK_NAME:-naporta}_db_hba_${CONFIG_VERSION:-v1}
    file: ../../database/security/pg_hba.conf
  db_init:
    name: ${STACK_NAME:-naporta}_db_init_${CONFIG_VERSION:-v1}
    file: ../../database/security/init-access.sql
  db_roles:
    name: ${STACK_NAME:-naporta}_db_roles_${CONFIG_VERSION:-v1}
    file: ../../database/security/roles.sql
  db_grants:
    name: ${STACK_NAME:-naporta}_db_grants_${CONFIG_VERSION:-v1}
    file: ../../database/security/grants.sql

secrets:
  tls_cert: {external: true, name: '${TLS_CERT_SECRET:?Defina TLS_CERT_SECRET}'}
  tls_key: {external: true, name: '${TLS_KEY_SECRET:?Defina TLS_KEY_SECRET}'}
  database_url: {external: true, name: '${DATABASE_URL_SECRET:?Defina DATABASE_URL_SECRET}'}
  jwt_secret: {external: true, name: '${JWT_SECRET_NAME:?Defina JWT_SECRET_NAME}'}
  postgres_password: {external: true, name: '${POSTGRES_PASSWORD_SECRET:?Defina POSTGRES_PASSWORD_SECRET}'}
  app_password: {external: true, name: '${APP_PASSWORD_SECRET:?Defina APP_PASSWORD_SECRET}'}
  migrator_password: {external: true, name: '${MIGRATOR_PASSWORD_SECRET:?Defina MIGRATOR_PASSWORD_SECRET}'}
  reader_password: {external: true, name: '${READER_PASSWORD_SECRET:?Defina READER_PASSWORD_SECRET}'}
