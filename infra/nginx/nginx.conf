worker_processes auto;
worker_rlimit_nofile 65535;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;
    server_tokens off;
    # Não registrar query strings, cabeçalhos, corpos ou tokens.
    log_format safe '$request_id $request_method $status $body_bytes_sent $request_time';
    access_log /dev/stdout safe;
    sendfile on;
    keepalive_timeout 30s;
    keepalive_requests 1000;
    client_max_body_size 1m;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 30s;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=connections:10m;
    limit_req_status 429;
    limit_conn_status 429;

    upstream backend {
        zone backend 64k;
        least_conn;
        server tasks.backend:3000 resolve max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 8080;
        location = /proxy-health { access_log off; return 200 '{"status":"ok"}'; }
        # Sem interpolar Host fornecido pelo cliente em redirects.
        location / { return 426 '{"error":"HTTPS required"}'; }
    }

    server {
        listen 8443 ssl;
        ssl_certificate /run/secrets/tls_cert;
        ssl_certificate_key /run/secrets/tls_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        add_header Strict-Transport-Security 'max-age=31536000' always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header X-Request-ID $request_id always;
        limit_conn connections 20;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        # O proxy é a borda pública; descartar Forwarded/XFF não confiáveis.
        proxy_set_header Forwarded '';
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
        # Não habilitar non_idempotent: escritas não devem ser repetidas.
        location = /api/v1/auth/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://backend;
        }
        location /api/v1/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://backend;
        }
        location / { return 404 '{"error":"Not found"}'; }
    }
}
