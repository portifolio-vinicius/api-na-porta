services:
  api:
    image: naporta-backend:local
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      API_PORT: '3000'
      DATABASE_URL: ${API_DATABASE_URL:-}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-900}
      CACHE_DIRECTORY: /var/cache/naporta
    ports:
      - '127.0.0.1:${API_HOST_PORT:-3000}:3000'
    volumes:
      - api_cache:/var/cache/naporta
    depends_on:
      cache-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  cache-init:
    image: naporta-backend:local
    build:
      context: ..
      dockerfile: backend/Dockerfile
    user: '0:0'
    entrypoint: ['/bin/sh', '-c']
    command: ['mkdir -p /var/cache/naporta && chown 1000:1000 /var/cache/naporta && chmod 0700 /var/cache/naporta']
    volumes:
      - api_cache:/var/cache/naporta
    restart: 'no'

  demo-user:
    image: naporta-backend:local
    build:
      context: ..
      dockerfile: backend/Dockerfile
    entrypoint: ['node', 'dist/seedDemoUser.js']
    environment:
      ENV: ${ENV:-local}
      DATABASE_URL: ${MIGRATOR_API_URL:-}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

volumes:
  api_cache:
